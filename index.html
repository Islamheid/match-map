<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7f2">
<meta name="description" content="A fun game that scores how well two people match by age or by zodiac sign, plus their initials. English and Arabic.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Match Map">
<title>Match Map: Age & Zodiac Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#faf7f2;--ink:#1d1b22;--muted:#6a6570;--accent:#b0413e;--line:#e7e1d8;--card:#fff;--violet:#5b4b8a}
  *{box-sizing:border-box}
  body{margin:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--ink);
    font-family:"Poppins","Cairo",system-ui,"Segoe UI",sans-serif;font-size:17px;line-height:1.65}
  html[lang=ar] body{font-family:"Cairo",system-ui,Tahoma,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:22px 16px 48px}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-size:clamp(30px,5.5vw,46px);margin:0;line-height:1.2;font-weight:800}
  .sub{color:var(--muted);margin:2px 0 0}
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px}
  .seg button{font:inherit;font-weight:800;font-size:15px;border:0;background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--muted)}
  .seg button.on{background:var(--ink);color:#fff}
  .basis{display:flex;justify-content:center;margin:0 0 18px}
  .basis .seg{padding:5px}
  .basis .seg button{font-size:17px;padding:9px 22px}
  .basis .seg button.on.z{background:var(--violet)}
  .lang{font:inherit;font-weight:800;font-size:15px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;color:var(--ink)}
  .lang:hover{border-color:var(--ink)}
  .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:start}
  @media (max-width:860px){.grid{grid-template-columns:1fr}#calc,#game{order:-1}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 2px 10px rgba(30,20,10,.04)}
  .card h2{font-size:19px;margin:0 0 12px;font-weight:800}
  #svg{width:100%;height:auto;display:block;direction:ltr;cursor:crosshair}
  .scale{display:flex;align-items:center;gap:10px;justify-content:center;font-size:14px;color:var(--muted);margin-top:6px;direction:ltr}
  .bar{width:220px;height:12px;border-radius:6px;background:linear-gradient(90deg,#c0392b,#e67e3a,#f2c75c,#a8cf72,#2e8b57)}
  .hint{font-size:14px;color:var(--muted);text-align:center;margin:4px 0 0}
  .names{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .names input{width:100%;font:inherit;font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--ink)}
  .field label{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
  .field output{font-size:28px;font-weight:800;color:var(--accent)}
  input[type=range]{width:100%;accent-color:var(--accent);height:28px}
  .signs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .signbox label{font-weight:600;display:block;margin-bottom:4px}
  .signbox select,.signbox input[type=date]{width:100%;font:inherit;font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink)}
  .signbox .sym{font-size:34px;line-height:1.1;color:var(--violet);text-align:center;margin-top:6px}
  .signbox .el{font-size:13px;color:var(--muted);text-align:center}
  details.dob{margin-top:10px;font-size:15px}
  details.dob summary{cursor:pointer;color:var(--violet);font-weight:600}
  details.dob .signs{margin-top:8px}
  .btn{font:inherit;font-weight:800;font-size:16px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:9px 20px;cursor:pointer}
  .btn:hover{background:var(--accent)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .center{text-align:center}
  .badge{display:inline-flex;align-items:center;justify-content:center;width:110px;height:110px;border-radius:50%;font-size:52px;margin:6px auto;box-shadow:0 0 0 8px rgba(0,0,0,.05);transition:background .4s}
  .initials{font-size:30px;font-weight:800;letter-spacing:1px;white-space:nowrap}
  .initials small{font-size:20px;color:var(--accent);margin:0 4px}
  .pop{animation:pop .45s ease}
  svg .pop{transform-box:fill-box;transform-origin:center}
  @keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
  .pct{font-size:44px;font-weight:800;line-height:1}
  .bonus{font-size:15px;font-weight:600;color:var(--muted);margin-top:6px}
  .bonus b{color:var(--ink)}
  .tier{font-size:24px;font-weight:800;margin:6px 0 2px}
  .desc{color:#3a3540;margin:0 0 6px}
  .meter{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:12px 0 4px;direction:ltr}
  .meter span{display:block;height:100%;transition:width .6s,background .4s}
  .tips{text-align:start;margin:12px 0 0;padding:10px 12px;background:var(--bg);border-radius:12px;font-size:15px;color:#3a3540}
  .hud{display:flex;justify-content:space-between;font-weight:800;color:var(--muted);font-size:15px;margin-bottom:6px}
  .couple{display:flex;justify-content:center;gap:18px;align-items:center;margin:8px 0 14px}
  .person{background:var(--bg);border-radius:14px;padding:10px 16px;min-width:120px;text-align:center}
  .person .n{font-weight:800;font-size:20px}
  .person .a{font-size:30px;font-weight:800;color:var(--accent);line-height:1.1}
  .person .a.z{color:var(--violet)}
  .av{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;margin:0 auto 4px}
  .heart{font-size:30px}
  .choices{display:grid;gap:8px}
  .choice{font:inherit;font-weight:800;font-size:16px;border:2px solid transparent;border-radius:12px;padding:9px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:start;color:var(--ink)}
  .choice:hover:not(:disabled){border-color:var(--ink)}
  .choice:disabled{cursor:default;opacity:.55}
  .choice.right{opacity:1;border-color:#2e8b57;box-shadow:0 0 0 3px rgba(46,139,87,.25)}
  .choice.wrong{opacity:1;border-color:var(--accent)}
  .feedback{min-height:56px;margin-top:10px;font-weight:800}
  .final .big{font-size:56px;font-weight:800;color:var(--accent);line-height:1}
  .rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;font-size:15px}
  .hidden{display:none !important}
  footer{margin-top:22px;font-size:14px;color:var(--muted);text-align:center}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 data-t="title"></h1>
      <p class="sub" data-t="sub"></p>
    </div>
    <div class="tools">
      <button class="btn hidden" id="install" style="font-size:14px;padding:6px 14px"></button>
      <button class="lang" id="lang"></button>
      <div class="seg" id="modes">
        <button class="on" data-m="calc" data-t="modeCalc"></button>
        <button data-m="game" data-t="modeGame"></button>
      </div>
    </div>
  </header>

  <div class="basis">
    <div class="seg" id="basis">
      <button class="on" data-b="age" data-t="byAge"></button>
      <button class="z" data-b="zodiac" data-t="byZodiac"></button>
    </div>
  </div>

  <div class="grid">
    <section class="card">
      <svg id="svg" viewBox="0 0 900 900" role="img"></svg>
      <div class="scale"><span data-t="scaleLow"></span><span class="bar"></span><span data-t="scaleHigh"></span></div>
      <p class="hint" id="mapHint"></p>
      <p class="hint" id="mapNote"></p>
    </section>

    <section class="card" id="calc">
      <div class="names">
        <input id="nG" maxlength="20" autocomplete="off">
        <input id="nB" maxlength="20" autocomplete="off">
      </div>
      <div id="ageInputs">
        <div class="field"><label for="g"><span data-t="groomAge"></span> <output id="gOut">29</output></label><input type="range" id="g" min="18" max="70" value="29"></div>
        <div class="field"><label for="b"><span data-t="brideAge"></span> <output id="bOut">26</output></label><input type="range" id="b" min="18" max="70" value="26"></div>
      </div>
      <div id="zodInputs" class="hidden">
        <div class="signs">
          <div class="signbox"><label for="zG" data-t="hisSign"></label><select id="zG"></select><div class="sym" id="zGs"></div><div class="el" id="zGe"></div></div>
          <div class="signbox"><label for="zB" data-t="herSign"></label><select id="zB"></select><div class="sym" id="zBs"></div><div class="el" id="zBe"></div></div>
        </div>
        <details class="dob">
          <summary data-t="dobAsk"></summary>
          <div class="signs">
            <div class="signbox"><label for="dG" data-t="hisDob"></label><input type="date" id="dG"></div>
            <div class="signbox"><label for="dB" data-t="herDob"></label><input type="date" id="dB"></div>
          </div>
        </details>
      </div>
      <div class="center">
        <div class="badge" id="emoji">💚</div>
        <div class="pct" id="pct">0%</div>
        <div class="bonus" id="bonus"></div>
        <div class="tier" id="tier"></div>
        <p class="desc" id="desc"></p>
        <div class="meter"><span id="meter"></span></div>
        <div class="tips" id="tip"></div>
        <div class="row"><button class="btn" id="rand" data-t="random"></button><button class="btn ghost" id="copy" data-t="copy"></button></div>
      </div>
    </section>

    <section class="card hidden" id="game">
      <div id="play">
        <div class="hud"><span id="round"></span><span id="score"></span></div>
        <div class="couple">
          <div class="person"><div class="av" id="gi"></div><div class="n" id="gn"></div><div class="a" id="ga"></div><div id="gu"></div></div>
          <div class="heart">💞</div>
          <div class="person"><div class="av" id="bi" style="background:var(--accent)"></div><div class="n" id="bn"></div><div class="a" id="ba"></div><div id="bu"></div></div>
        </div>
        <h2 class="center" data-t="question"></h2>
        <p class="hint" style="margin:-6px 0 10px" data-t="lettersCount"></p>
        <div class="choices" id="choices"></div>
        <div class="feedback center" id="fb"></div>
        <div class="row"><button class="btn hidden" id="next"></button></div>
      </div>
      <div class="final center hidden" id="final">
        <h2 data-t="over"></h2>
        <div class="big" id="finalScore">0</div>
        <div data-t="outOf"></div>
        <div class="tier" id="rank"></div>
        <p class="desc" id="best"></p>
        <div class="row"><button class="btn" id="again" data-t="again"></button><button class="btn ghost" id="share" data-t="shareScore"></button></div>
      </div>
    </section>
  </div>

  <section class="card hidden" id="zodRulesCard" style="margin-top:20px">
    <h2 data-t="zodRulesTitle"></h2>
    <div class="rules" id="zodRules"></div>
  </section>
  <section class="card" style="margin-top:20px">
    <h2 data-t="rulesTitle"></h2>
    <div class="rules" id="rules"></div>
  </section>

  <footer data-t="footer"></footer>
</div>
<div class="toast" id="toast"></div>

const SIGNS=[ // [symbol, element index, start month, start day]
  ["♈",0,3,21],["♉",1,4,20],["♊",2,5,21],["♋",3,6,21],["♌",0,7,23],["♍",1,8,23],
  ["♎",2,9,23],["♏",3,10,23],["♐",0,11,22],["♑",1,12,22],["♒",2,1,20],["♓",3,2,19]];
const EL_EMOJI=["🔥","🌍","💨","💧"];
function signFromDate(m,d){ // returns sign index
  let idx=9; // Capricorn default (Dec 22 – Jan 19)
  for(let i=0;i<12;i++){const[,,sm,sd]=SIGNS[i];
    const nm=SIGNS[(i+1)%12][2],nd=SIGNS[(i+1)%12][3];
    const after=(m>sm)||(m===sm&&d>=sd), before=(m<nm)||(m===nm&&d<nd);
    if(sm<nm ? (after&&before) : (after||before)){idx=i;break;}}
  return idx;
}
// relation by distance around the wheel
const REL={0:"twin",1:"neighbor",2:"friendly",3:"friction",4:"element",5:"odd",6:"opposite"};

const relOf=(a,b)=>{const k=Math.abs(a-b)%12;return REL[Math.min(k,12-k)];};
const zScore=(a,b)=>REL_SCORE[relOf(a,b)];

  $("choices").innerHTML=TIERS.map((t,i)=>`<button class="choice" data-i="${i}" style="background:${t.col}22"><span style="font-size:22px">${t.emoji}</span>${T().tiers[i][0]}</button>`).join("");
  document.querySelectorAll(".choice").forEach(c=>c.onclick=()=>answer(+c.dataset.i));
}
function startGame(){round=0;pts=0;cur=null;$("final").classList.add("hidden");$("play").classList.remove("hidden");nextRound();}
function nextRound(){round++;answered=false;cur=newCouple();mark(0,0,false);drawCouple();$("fb").textContent="";$("next").classList.add("hidden");}
function answer(i){
  if(answered)return;answered=true;cur.pick=i;
  const F=finalScore(cur.x,cur.y,cur.gn,cur.bn),diff=Math.abs(i-tierOf(F.s));
  pts+=diff===0?10:diff===1?5:0;$("score").textContent=T().points(pts);showAnswer();
}
function showAnswer(){
  const F=finalScore(cur.x,cur.y,cur.gn,cur.bn),ti=tierOf(F.s),i=cur.pick,diff=Math.abs(i-ti);
  document.querySelectorAll(".choice").forEach(c=>{c.disabled=true;const k=+c.dataset.i;if(k===ti)c.classList.add("right");else if(k===i)c.classList.add("wrong");});
  mark(cur.x,cur.y,true);
  const baseW=basis==="age"?T().ageWord:`${T().signsWord} (${REL_ICON[relOf(cur.x,cur.y)]} ${T().rel[relOf(cur.x,cur.y)][0]})`;
  $("fb").innerHTML=(diff===0?T().right:diff===1?T().close:T().miss)+
    `<br><span style="font-weight:600;color:var(--muted)">${baseW} ${F.base}% · ${T().lettersWord} ${sign(F.lb.v)} (${T().lb[F.lb.k]}) = ${F.s}% · ${T().tiers[ti][0]}</span>`;
  const n=$("next");n.textContent=round<10?T().next:T().seeFinal;n.classList.remove("hidden");
}
$("next").onclick=()=>{round<10?nextRound():endGame();};
const bestKey=()=>basis==="age"?"tawafuq_best":"tawafuq_best_zodiac";
function endGame(){
  $("play").classList.add("hidden");$("final").classList.remove("hidden");$("finalScore").textContent=pts;
  let best=pts;try{best=Math.max(pts,+(localStorage.getItem(bestKey())||0));localStorage.setItem(bestKey(),best);}catch(e){}
  renderFinal(best);
}
function renderFinal(best){
  if(best==null){try{best=+(localStorage.getItem(bestKey())||pts);}catch(e){best=pts;}}
  $("rank").textContent=T().ranks[pts>=90?0:pts>=70?1:pts>=50?2:3];$("best").textContent=T().best(best);
}
$("again").onclick=startGame;
$("share").onclick=()=>copyText(T().shareTxt(pts,$("rank").textContent,basis==="zodiac"));

/* ================= language, modes, basis ================= */
function fillSelects(){
  [zG,zB].forEach(s=>{const v=s.value||(s===zG?"4":"0");s.innerHTML=SIGNS.map((g,i)=>`<option value="${i}">${g[0]} ${T().signs[i]}</option>`).join("");s.value=v;});
}
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.title=lang==="ar"?"خريطة التوافق: العمر والأبراج":"Match Map: Age & Zodiac Game";
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=T()[e.dataset.t]);
  $("lang").textContent=T().langBtn;$("install").textContent=T().install;
  $("nG").placeholder=T().phG;$("nB").placeholder=T().phB;
  fillSelects();
  svg.setAttribute("aria-label",T().title);
  $("rules").innerHTML=T().rules.map(([a,v])=>`<div>${a}: <b dir="ltr">${v}</b></div>`).join("");
  $("zodRules").innerHTML=T().zRules.map(([a,v])=>`<div>${a}: <b dir="ltr">${v}</b></div>`).join("");
  refresh();
}
function refresh(){
  const z=basis==="zodiac";
  $("ageInputs").classList.toggle("hidden",z);$("zodInputs").classList.toggle("hidden",!z);$("zodRulesCard").classList.toggle("hidden",!z);
  $("mapHint").textContent=mode==="calc"?T().mapHintCalc:T().mapHintGame;
  $("mapNote").textContent=z?T().mapNoteZod:T().mapNoteAge;
  drawMap();lastTier=-1;
  if(mode==="calc")render();
  else if(!$("final").classList.contains("hidden"))renderFinal();
  else if(cur){drawCouple();if(answered)showAnswer();else mark(0,0,false);}
}
$("lang").onclick=()=>{lang=lang==="en"?"ar":"en";try{localStorage.setItem("mm_lang",lang);}catch(e){}applyLang();};
document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>{
  mode=b.dataset.m;document.querySelectorAll("#modes button").forEach(x=>x.classList.toggle("on",x===b));
  $("calc").classList.toggle("hidden",mode!=="calc");$("game").classList.toggle("hidden",mode!=="game");
  if(mode==="game"){drawMap();startGame();$("mapHint").textContent=T().mapHintGame;}else refresh();
});
document.querySelectorAll("#basis button").forEach(b=>b.onclick=()=>{
  if(basis===b.dataset.b)return;basis=b.dataset.b;
  document.querySelectorAll("#basis button").forEach(x=>x.classList.toggle("on",x===b));
  if(mode==="game"){refresh();startGame();}else refresh();
});
applyLang();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
let deferred=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;$("install").classList.remove("hidden");});
$("install").onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$("install").classList.add("hidden");};
window.addEventListener("appinstalled",()=>{$("install").classList.add("hidden");toast(T().installed);});



</script>
</body>
</html>
